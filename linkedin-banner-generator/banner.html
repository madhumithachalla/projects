  .streak { position:absolute; height:3px; border-radius:3px; transform-origin:right center; }

  .dot { width:10px; height:10px; border-radius:50%; background:#FF6F5E; box-shadow:0 0 0 4px rgba(255,111,94,.3); flex:none; }
  .visa { font:500 20px/1 'Inter',sans-serif; color:#C7BEDB; }

  .headline { position:absolute; left:500px; top:98px; white-space:nowrap;
    font:700 64px/1.05 'Fraunces',serif; letter-spacing:-.02em;
    background:linear-gradient(105deg,#FFFFFF 18%,#FFF3D6 42%,#F5A623 68%,#FF6F5E 94%);
    -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 6px 22px rgba(245,166,35,.18)); }

  /* row 3: skills as plain keywords separated by pipes */

  .contact .link { color:#2DD4BF; }
  .contact .mail { color:#F3EEFA; }

  .stats { position:absolute; left:500px; top:288px; display:flex; align-items:center; gap:22px; white-space:nowrap; font:500 20px/1 'Inter',sans-serif; color:#C7BEDB; }
