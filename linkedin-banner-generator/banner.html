<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=IBM+Plex+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:1584px; height:396px; overflow:hidden;
    background:#0D0A16;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .banner {
    position:relative; width:1584px; height:396px;
    background:
      radial-gradient(circle at 82% 12%, rgba(255,111,94,0.38), transparent 40%),
      radial-gradient(circle at 96% 60%, rgba(245,166,35,0.30), transparent 42%),
      radial-gradient(circle at 68% 95%, rgba(45,212,191,0.26), transparent 45%),
      radial-gradient(circle at 55% 40%, rgba(155,126,222,0.30), transparent 55%),
      #0D0A16;
    overflow:hidden;
  }

  /* meteor streaks - static, decorative, now colour-cycled brighter */
  .streak { position:absolute; height:3px; border-radius:2px; transform-origin:right center; }
  .streak.s1 { width:190px; top:64px; left:900px; transform:rotate(18deg); background:linear-gradient(90deg, transparent, #FF6F5E); }
  .streak.s2 { width:130px; top:148px; left:1190px; transform:rotate(18deg); background:linear-gradient(90deg, transparent, #FFCB73); }
  .streak.s3 { width:160px; top:282px; left:1010px; transform:rotate(18deg); background:linear-gradient(90deg, transparent, #2DD4BF); }
  .spark { position:absolute; width:5px; height:5px; border-radius:50%; }
  .spark.c1 { background:#FF6F5E; box-shadow:0 0 12px 3px rgba(255,111,94,0.8); }
  .spark.c2 { background:#FFCB73; box-shadow:0 0 12px 3px rgba(255,203,115,0.8); }
  .spark.c3 { background:#2DD4BF; box-shadow:0 0 12px 3px rgba(45,212,191,0.8); }

  /* left ~540px kept clear for the circular profile photo LinkedIn overlays */
  .content {
    position:absolute; left:540px; top:88px; right:56px; bottom:88px;
    display:flex; flex-direction:column; justify-content:center;
  }

  .name {
    font-family:'Fraunces', serif;
    font-weight:800;
    font-size:78px;
    line-height:0.93;
    letter-spacing:-0.01em;
    background:linear-gradient(100deg, #FFFFFF 30%, #FFCB73 62%, #FF6F5E 88%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:14px;
  }

  .tagline {
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:23px;
    color:#F3EEFA;
    margin-bottom:20px;
  }
  .tagline b { color:#2DD4BF; font-weight:700; }

  .stack {
    display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap;
  }
  .pill {
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:14px;
    color:#0D0A16;
    background:#F3EEFA;
    padding:6px 15px;
    border-radius:20px;
  }
  .pill.c-coral { background:#FF6F5E; color:#1B1130; }
  .pill.c-amber { background:#FFCB73; color:#1B1130; }
  .pill.c-teal { background:#2DD4BF; color:#0D0A16; }
  .pill.c-violet { background:#C4A6FB; color:#1B1130; }

  .contact-row {
    display:flex; gap:13px; align-items:center; flex-wrap:nowrap;
  }
  .contact-row span {
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:13px;
    color:#F3EEFA;
    white-space:nowrap;
  }
  .contact-row .dot { color:#FFCB73; }

  .signature {
    position:absolute; right:56px; bottom:30px;
    font-family:'IBM Plex Mono', monospace;
    font-weight:500;
    font-size:14px;
    color:#B9AACF;
    letter-spacing:0.02em;
  }
  .signature b { color:#FF6F5E; }
</style>
</head>
<body>
  <div class="banner">
    <div class="streak s1"></div>
    <div class="streak s2"></div>
    <div class="streak s3"></div>
    <div class="spark c1" style="top:62px; left:1080px;"></div>
    <div class="spark c2" style="top:146px; left:1310px;"></div>
    <div class="spark c3" style="top:280px; left:1160px;"></div>

    <div class="content">
      <div class="name">Madhumitha<br>Challa</div>
      <div class="tagline"><b>Cloud &amp; Systems Engineering</b> · Data · IT Support</div>
      <div class="stack">
        <div class="pill c-coral">AWS</div>
        <div class="pill c-amber">Azure</div>
        <div class="pill c-teal">Oracle Cloud HCM</div>
        <div class="pill c-violet">Microsoft 365</div>
        <div class="pill">Python</div>
      </div>
      <div class="contact-row">
        <span>madhumithachalla.github.io</span>
        <span class="dot">·</span>
        <span>rchmadhumitha@gmail.com</span>
        <span class="dot">·</span>
        <span>linkedin.com/in/madhumitha-challa</span>
        <span class="dot">·</span>
        <span>github.com/MadhumithaChalla</span>
      </div>
    </div>

    <div class="signature">aka <b>Female Photon</b> ✦ writing &amp; singing</div>
  </div>
</body>
</html>
